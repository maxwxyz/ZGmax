# Baut die portablen Apps fuer Windows, macOS (Apple-Chip) und Linux auf den aktuellen GitHub-Systemen.
# Start von Hand: auf GitHub "Actions" -> "Apps bauen" -> "Run workflow". Die ZIP/TAR-Dateien liegen danach unten im
# Lauf unter "Artifacts".
name: Apps bauen
on:
  workflow_dispatch:
    inputs:
      plattform:
        description: "Welche Plattform bauen (macOS-Minuten zählen bei privaten Repos zehnfach)"
        type: choice
        default: alle
        options: [alle, Windows-x64, macOS-arm64, Linux-x64]
      tests:
        description: "Tests vor dem Bauen ausführen (aus = deutlich schneller; Selbsttest der App läuft immer)"
        type: boolean
        default: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows-x64
          - os: macos-latest        # Apple-Chip (arm64)
            name: macOS-arm64
          - os: ubuntu-latest
            name: Linux-x64
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      AKTIV: ${{ inputs.plattform == 'alle' || inputs.plattform == matrix.name }}
      ZGMAX_OHNE_TESTS: ${{ inputs.tests && '0' || '1' }}
    steps:
      - uses: actions/checkout@v4
        if: env.AKTIV == 'true'
      - uses: actions/setup-python@v5
        if: env.AKTIV == 'true'
        with:
          python-version: "3.14"    # wie beim Entwickeln getestet
      - name: Qt-Grundpakete (Linux)
        if: env.AKTIV == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 \
            fonts-dejavu-core
      - name: Bauen und testen
        if: env.AKTIV == 'true'
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) echo | cmd //c "packaging\\build_windows.bat" ;;
            macOS)   bash packaging/build_mac.sh ;;
            Linux)   bash packaging/build_linux.sh ;;
          esac
      - name: Selbsttest der fertigen App
        if: env.AKTIV == 'true'
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) dist/ZGmax/ZGmax.exe --selbsttest ;;
            macOS)   dist/ZGmax.app/Contents/MacOS/ZGmax --selbsttest ;;
            Linux)   dist/ZGmax/ZGmax --selbsttest ;;
          esac
      - uses: actions/upload-artifact@v4
        if: env.AKTIV == 'true'
        with:
          name: ZGmax-${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
