# Baut die portablen Apps fuer Windows, macOS (Apple-Chip) und Linux auf den aktuellen GitHub-Systemen.
# Start von Hand: auf GitHub "Actions" -> "Apps bauen" -> "Run workflow". Die ZIP/TAR-Dateien liegen danach unten im
# Lauf unter "Artifacts".
name: Apps bauen
on:
  workflow_dispatch:
    inputs:
      plattform:
        description: "Welche Plattform bauen (macOS-Minuten zählen bei privaten Repos zehnfach)"
        type: choice
        default: alle
        options: [alle, Windows-x64, macOS-arm64, Linux-x64]
      tests:
        description: "Tests vor dem Bauen ausführen (aus = deutlich schneller; Selbsttest der App läuft immer)"
        type: boolean
        default: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows-x64
          - os: macos-latest        # Apple-Chip (arm64)
            name: macOS-arm64
          - os: ubuntu-latest
            name: Linux-x64
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      AKTIV: ${{ inputs.plattform == 'alle' || inputs.plattform == matrix.name }}
      ZGMAX_OHNE_TESTS: ${{ inputs.tests && '0' || '1' }}
    steps:
      - uses: actions/checkout@v7
        if: env.AKTIV == 'true'
      - uses: actions/setup-python@v7
        if: env.AKTIV == 'true'
        with:
          python-version: "3.14"    # wie beim Entwickeln getestet
      - name: Qt-Grundpakete (Linux)
        if: env.AKTIV == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 \
            fonts-dejavu-core
      - name: Bauen und testen
        if: env.AKTIV == 'true'
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) echo | cmd //c "packaging\\build_windows.bat" ;;
            macOS)   bash packaging/build_mac.sh ;;
            Linux)   bash packaging/build_linux.sh ;;
          esac
      - name: Selbsttest der fertigen App
        if: env.AKTIV == 'true'
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) dist/ZGmax/ZGmax.exe --selbsttest ;;
            macOS)   dist/ZGmax.app/Contents/MacOS/ZGmax --selbsttest ;;
            Linux)   dist/ZGmax/ZGmax --selbsttest ;;
          esac
      - name: Startzeit der fertigen App messen (nur zur Information)
        if: env.AKTIV == 'true'
        continue-on-error: true
        timeout-minutes: 3
        shell: bash
        env:
          ZGMAX_STARTZEIT_DATEI: startzeit.txt
        run: |
          case "$RUNNER_OS" in
            Windows) APP=dist/ZGmax/ZGmax.exe ;;
            macOS)   APP=dist/ZGmax.app/Contents/MacOS/ZGmax ;;
            Linux)   APP=dist/ZGmax/ZGmax; export QT_QPA_PLATFORM=offscreen ;;
          esac
          for i in 1 2 3; do
            ZGMAX_T0=$(python -c "import time; print(time.time())") "$APP" --startzeit programm/icon.png || true
          done
          cat startzeit.txt
      - name: Windows-Installer bauen und probeweise installieren
        if: env.AKTIV == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; if ($LASTEXITCODE -ne 0) { exit 1 } }
          $ver = (.venv\Scripts\python -c "import sys; sys.path.insert(0,'programm'); import version; print(version.VERSION)")
          & $iscc "/DAPPVER=$ver" packaging\zgmax.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $setup = "dist\ZGmax-$ver-Windows-x64-Setup.exe"
          # Probe: ohne Adminrechte nur fuer den Nutzer installieren, App pruefen, Eintraege pruefen, wieder entfernen
          $ziel = "$env:RUNNER_TEMP\ZGmax-Probe"
          Start-Process $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/CURRENTUSER","/NORESTART","/DIR=`"$ziel`"","/LOG=`"$env:RUNNER_TEMP\setup.log`"" -Wait
          if (-not (Test-Path "$ziel\ZGmax.exe")) { Get-Content "$env:RUNNER_TEMP\setup.log" -Tail 40; throw "Installation fehlgeschlagen" }
          # Update: noch einmal darueber installieren (ohne Zielangabe -> muss den vorhandenen Ordner nehmen)
          Set-Content "$ziel\_internal\alt.txt" "Rest einer frueheren Version"
          Start-Process $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          if (Test-Path "$ziel\_internal\alt.txt") { throw "Update hat alte Dateien nicht entfernt" }
          if (-not (Test-Path "$ziel\ZGmax.exe")) { throw "Update hat nicht in den vorhandenen Ordner installiert" }
          $p = Start-Process "$ziel\ZGmax.exe" -ArgumentList "--selbsttest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Selbsttest der installierten App fehlgeschlagen" }
          $cmd = (Get-ItemProperty "HKCU:\Software\Classes\ZGmax.Projekt\shell\open\command").'(default)'
          if ($cmd -notlike "*ZGmax.exe*") { throw "Dateityp .zgmax nicht eingetragen: $cmd" }
          Get-Item "HKCU:\Software\Classes\.pdf\OpenWithProgids" | Out-Null
          Write-Host "Installiert nach $ziel, .zgmax -> $cmd"
          $un = Get-ChildItem "$ziel\unins*.exe" | Select-Object -First 1
          Start-Process $un.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          if (Test-Path "HKCU:\Software\Classes\ZGmax.Projekt") { throw "Deinstallation hat Eintraege hinterlassen" }
          Write-Host "Deinstallation sauber"
      - uses: actions/upload-artifact@v7
        if: env.AKTIV == 'true'
        with:
          name: ZGmax-${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*-Setup.exe
          if-no-files-found: error
